runtime_failure_history:
  - first Cloudflare production upload rejected before activation because httpcore2 was missing.
  - UTF-8 BOM in pyproject.toml caused a local parser failure and was removed.
  - Binance Futures returned HTTP 403 from Cloudflare runtime.
  - Binance Spot also returned HTTP 403; targeted remote-FRA placement did not restore access.
  - Coinbase Exchange fallback restored Decision and Delta without fabricating unavailable channels.
  - Validation was explicitly routed through the multi-provider kline path and then passed.
  - previous verified runtime SHA 382139064dbaa7da52495e063a4ae07e88c85a12 was superseded by approved TRACE runtime SHA 973ce1530e7a2205366b1115dc9bb4804bae2353.

canonical_epistemic_rules:
  - Real failure > fake success.
  - Evidence before recommendation. Refusal before false confidence.
  - AVAILABLE != FRESH != CONSISTENT != ACTIONABLE.
  - AWS Tokyo case is OBSERVED_EXTERNAL, not a SignalForge historical replay.
  - Controlled negative fixture is OBSERVED_IN_BUILD and explicitly not a historical replay.
  - Validation Lab validates only price-derived 3-of-5 signals and is not proof of profitability.
  - Coinbase provenance remains explicit and must never be relabelled as Binance.
  - Recommendation output never grants execution authority.


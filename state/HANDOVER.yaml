  core_visual_thesis: >-
    Turn the evidence lifecycle itself into the primary visual object: sources become colored matter,
    admission/exclusion is visible, freshness expires, the policy gate can visibly close, evidence debt stacks,
    recovery draws a repair path, and the lifecycle closes with an inspectable receipt.

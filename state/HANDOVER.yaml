runtime_failure_history:
  - first Cloudflare production upload was rejected before activation because httpcore2 was missing from the Python Worker bundle.
  - PowerShell introduced a UTF-8 BOM into pyproject.toml; the file was rewritten cleanly.
  - first activated Worker passed judge/health/xagent/negative-path but Decision, Delta and Validation failed closed because Binance Futures returned HTTP 403.
  - Binance public Spot also returned HTTP 403; targeted remote-FRA placement did not restore Binance access.
  - Coinbase Exchange public fallback restored live-partial Decision and Delta while keeping funding and open-interest unavailable.
  - Validation was explicitly routed through the multi-provider kline path and then passed.
  - exact commit was proven via Cloudflare control plane, forced-version requests and subsequent normal public requests; do not invent a Cloudflare propagation mechanism.

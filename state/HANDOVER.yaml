  - no_decorative_gradient_without_information_role
  - unavailable_evidence_must_never_look_healthy
  - provenance_stays_near_the_conclusion
  - refusal_is_a_first_class_product_state
  - execution_authority_is_a_separate_control_plane
  - reduced_motion_must_preserve_state_information
  - interface_must_not_be_reasonably_mistaken_for_generic_SaaS_admin
canonical_epistemic_rules:
  - Real failure > fake success.
  - Evidence before recommendation. Refusal before false confidence.
  - AVAILABLE != FRESH != CONSISTENT != ACTIONABLE.
  - AWS Tokyo case is OBSERVED_EXTERNAL and not a SignalForge historical replay.
  - controlled negative fixture is OBSERVED_IN_BUILD and explicitly not a historical replay.
  - Validation Lab validates only price-derived 3-of-5 signals and is not proof of profitability.
  - Coinbase fallback provenance remains explicit and must never be relabelled as Binance.
  - recommendation output never grants execution authority.

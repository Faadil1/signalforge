v3_evidence_lifecycle:
  decision_packet:
    contract_version: "1.1"
    policy_version: evidence-gate-2026-09
    execution_authorized: false
    includes:
      - evidence_admission_ledger
      - evidence_lineage
      - evidence_lease
      - recovery_requirements
      - tamper_evident_receipt
  stress_and_sufficiency:
    rest: GET_/api/v1/decision/{token}/stress
    mcp: stress_test_decision
    covers:
      - single_channel_dropouts
      - provider_dropouts
      - minimum_dropouts_to_refusal
      - minimum_refusal_sets
      - minimum_sufficient_evidence
  refusal_recovery:
    rest: GET_/api/v1/decision/{token}/recovery-plan
    mcp: plan_evidence_recovery
    contract: refusal_recovery_v1
    outputs:
      - evidence_debt
      - blocking_conditions
      - unavailable_signals
      - safe_reacquisition_candidates
      - reevaluation_gate
      - refusal_receipt_id
    guarantees_actionability: false
    execution_authorized: false
  recovery_verification:
    rest: POST_/api/v1/decision/{token}/verify-recovery
    mcp: verify_evidence_recovery
    contract: recovery_verification_v1
    caller_supplies: prior_refusal_recovery_plan
    statuses:
      - unchanged_refusal
      - improved_but_still_refused
      - degraded_since_refusal
      - policy_gate_recovered
    observed_fields:
      - evidence_repair_observed
      - recovered_signals
      - newly_unavailable_signals
      - resolved_blockers
      - new_blockers
      - coverage_gap_delta
      - confidence_gap_delta
    guarantees_correct_direction: false
    execution_authorized: false
  receipt_integrity:
    rest: POST_/api/v1/decision/verify-receipt
    mcp: verify_decision_receipt
    is_signature: false
  resilience_benchmark:
    rest: GET_/api/v1/evidence/resilience-benchmark
    mcp: run_evidence_resilience_benchmark
    scope: controlled_policy_conformance_not_market_accuracy
  durable_compare:
    rest: POST_/api/v1/decision/{token}/compare
    mcp: compare_decision_packet
    persistence: caller_supplied_baseline

mcp_v3:
  endpoint: POST_/mcp
  protocol: "2026-07-28"
  server_version: "0.6.0"
  stateless: true
  read_only: true
  destructive: false
  tools:
    - get_decision_packet
    - compare_decision_packet
    - stress_test_decision
    - plan_evidence_recovery
    - verify_evidence_recovery
    - verify_decision_receipt
    - validate_price_signals
    - inspect_negative_path
    - run_evidence_resilience_benchmark


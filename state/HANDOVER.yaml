v3_evidence_lifecycle:
  flow: >-
    RAW SOURCE -> ADMISSION/EXCLUSION -> LINEAGE -> FRESHNESS LEASE -> DERIVED EVIDENCE ->
    COVERAGE/CONFIDENCE GATE -> FRAGILITY/SUFFICIENCY -> REFUSE/HANDOFF -> EVIDENCE DEBT ->
    RECOVERY PLAN -> REACQUIRE -> RECOVERY VERIFICATION -> REFUSE AGAIN/HANDOFF -> RECEIPT
  decision_packet:
    includes:
      - evidence_admission_ledger
      - evidence_lineage
      - evidence_lease
      - recovery_requirements
      - tamper_evident_receipt
  refusal_recovery:
    rest: GET_/api/v1/decision/{token}/recovery-plan
    mcp: plan_evidence_recovery
    guarantees_actionability: false
  recovery_verification:
    rest: POST_/api/v1/decision/{token}/verify-recovery
    mcp: verify_evidence_recovery
    guarantees_correct_direction: false
    execution_authorized: false
  receipt_integrity:
    rest: POST_/api/v1/decision/verify-receipt
    mcp: verify_decision_receipt
    is_signature: false

mcp_v3:
  endpoint: POST_/mcp
  protocol: "2026-07-28"
  server_version: "0.6.0"
  stateless: true
  read_only: true
  destructive: false
  tools:
    - get_decision_packet
    - compare_decision_packet
    - stress_test_decision
    - plan_evidence_recovery
    - verify_evidence_recovery
    - verify_decision_receipt
    - validate_price_signals
    - inspect_negative_path
    - run_evidence_resilience_benchmark


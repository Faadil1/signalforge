runtime_failure_history:
  - initial real deployment rejected because httpcore2 was absent from the Python Worker bundle; fixed by explicit dependency and CI packaging assertion.
  - PowerShell introduced a UTF-8 BOM into pyproject.toml; fixed by clean rewrite.
  - first activated Cloudflare runtime passed judge/health/xagent/negative-path but Decision, Delta and Validation returned 502 because Binance Futures returned HTTP 403.
  - Binance public Spot also returned HTTP 403; targeted remote-FRA placement did not restore Binance access.
  - Coinbase Exchange public fallback restored Decision and Delta while keeping funding/open-interest unavailable.
  - Validation was explicitly routed through get_validation_klines and then passed.
  - final runtime exact commit was proven first with a forced-version request and then normally without override; do not claim a specific internal Cloudflare propagation mechanism.

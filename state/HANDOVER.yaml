completed:
  - Preserved all evidence/failure hardening from PR #2.
  - Kept cloudflare-runtime isolated so PR #2 can continue review independently.
  - Built a single Cloudflare Worker serving static Next.js assets and FastAPI routes from one origin.
  - Added conditional Next.js static export and verified /judge export.
  - Added Python Worker ASGI adapter and Cloudflare-only httpx2 aliasing.
  - Explicitly bundled httpcore2 after first real deploy failed validation with ModuleNotFoundError.
  - Removed an accidental UTF-8 BOM from pyproject.toml that broke pywrangler parsing.
  - Aligned Pydantic to a Pyodide-compatible Cloudflare-only dependency set.
  - Added Cloudflare targeted placement with aws:eu-central-1; observed runtime placement remote-FRA.
  - Verified Binance Futures and Binance Spot both return HTTP 403 from Cloudflare runtime even under remote-FRA placement.
  - Added evidence-preserving multi-provider fallback: Binance Futures -> Binance Spot -> Coinbase Exchange for ticker/klines.
  - Kept funding and open interest unavailable rather than synthesized when Binance is blocked.
  - Added explicit validation market-data fallback to avoid an indirect monkeypatch ambiguity.
  - Verified Decision Packet and Signal Delta return HTTP 200 using live_partial Coinbase evidence.
  - Verified bounded 120-day/3-day Validation Lab returns HTTP 200 using Coinbase klines.
  - Verified controlled negative path remains fail-closed and is not represented as a historical replay.
  - Verified exact deployed SHA through both /health and /.well-known/xagent-verification.json.
  - Verified Cloudflare control plane has version eb5bcc9b-e5c0-4914-8ff2-9f82eecc0a39 at 100 percent traffic with the exact GIT_COMMIT binding.
  - Used a forced-version override once to prove the exact version bundle, then repeated the full proof normally without override.
  - Cloudflare Runtime Verify run 32 passed on deployed commit 382139064dbaa7da52495e063a4ae07e88c85a12.
important_failure_history:
  - >-
    Initial real deployment failed before activation because httpx2 imported httpcore2 but httpcore2
    was not packaged. Fixed by declaring httpcore2 directly and asserting it in CI.
  - >-
    A PowerShell write added a BOM to pyproject.toml and caused an invalid TOML dry-run failure.
    Fixed by rewriting the file without BOM.
  - >-
    First activated Cloudflare runtime at d0f2bad5db52f85175eb74c558e4c47987e8c456 passed
    judge/health/xagent/negative-path but Decision, Delta and Validation returned 502 because Binance
    Futures access failed.
  - >-
    Exact error evidence showed Binance /fapi/v1/klines HTTP 403. Binance public Spot fallback also
    returned HTTP 403. Targeted placement to remote-FRA did not change the Binance result.
  - >-
    Multi-provider Coinbase fallback restored Decision and Delta. Validation initially remained on an
    old Binance-only path, then was explicitly routed through get_validation_klines and passed.
  - >-
    Immediately after the final deploy, normal requests briefly showed the prior commit/code shape.
    Cloudflare deployments status showed the new version at 100 percent and the version binding was correct.
    Forced-version requests proved the exact new bundle; shortly afterward normal public requests also
    returned the exact commit and new validation provenance. Do not claim a specific Cloudflare internal
    propagation mechanism because it was not independently established.
epistemic_rules:
  - Real failure > fake success.
  - Evidence before recommendation. Refusal before false confidence.
  - AVAILABLE != FRESH != CONSISTENT != ACTIONABLE.
  - Historical AWS Tokyo case is OBSERVED_EXTERNAL, not a SignalForge historical replay.
  - Controlled negative fixture is OBSERVED_IN_BUILD and explicitly not a historical replay.
  - Validation Lab validates only price-derived 3-of-5 signals and is not proof of profitability.
  - Multi-provider fallback provenance must stay explicit; do not relabel Coinbase as Binance.
  - AI/recommendation output never grants execution authority.

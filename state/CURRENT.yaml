canonical_principles:
  - "Real failure > fake success"
  - "Evidence before recommendation. Refusal before false confidence. Recovery before retry."
  - "AVAILABLE != FRESH != CONSISTENT != ACTIONABLE"
  - "SignalForge is a pre-action evidence gate that proves when a market agent should refuse to act."
  - "Evidence repair is observable; it is not proof of correctness, profitability, or execution authority."


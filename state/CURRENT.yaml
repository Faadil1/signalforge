  public_pr_scan_caveat: >-
    No matching public PR language is not proof that no competitor has an internally similar mechanism.
  no_public_pr_term_matches_observed_for:
    - evidence_lease
    - fragility
    - admission_ledger
    - minimum_sufficient
    - recovery_verification
  winning_bundle:
    - source_admission_and_exclusion
    - dependency_and_provider_lineage
    - freshness_time_boundary
    - decision_fragility_and_minimum_sufficiency
    - machine_readable_refusal
    - evidence_debt_and_recovery_plan
    - observed_recovery_verification
    - decision_and_refusal_receipts
    - no_execution_authority

trace_ui_v2:
  status: ready_after_upstream_merge_and_final_exact_redeploy
  next_design_object: Evidence_Lifecycle_and_Refusal_Recovery
  narrative: >-
    raw source -> admission/exclusion -> lineage -> freshness lease -> derived evidence ->
    coverage/confidence gate -> fragility/sufficiency -> refusal or handoff -> evidence debt ->
    recovery plan -> observed recovery verification -> receipt integrity

merge_and_deploy_boundary:
  auto_merge_authorized: false
  Opeyemi_review_required: true
  current_live_sha_is_branch_head_not_upstream_main: true
  preferred_sequence:
    - Opeyemi_reviews_and_merges_PR_3
    - capture_exact_upstream_main_SHA
    - redeploy_exact_merged_SHA_to_Cloudflare
    - verify_core_public_proofs
    - verify_recovery_verification_receipt_tools_list_and_tool_call
    - mark_upstream_main_as_canonical_live
    - then_start_TRACE_UI_UX_v2

submission_ready: false
submission_blockers:
  - winning_intelligence_v3_not_upstream_merged
  - exact_merged_upstream_main_not_deployed
  - recovery_verification_and_receipt_public_proofs_not_recorded
  - MCP_tools_list_and_tool_call_public_proofs_not_recorded
  - official_X_Agent_submission_package_not_finalized

stop_conditions:
  - mock_presented_as_live
  - degraded_evidence_presented_as_healthy
  - recovery_presented_as_guaranteed_actionability
  - recovery_verification_presented_as_correctness_or_profitability_proof
  - evidence_lease_presented_as_forecast_validity
  - receipt_presented_as_signature_or_external_truth
  - execution_authority_claimed_by_signalforge
  - controlled_fixture_described_as_historical_replay
  - full_five_channel_validation_claim_without_real_history

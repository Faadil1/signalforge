name: Cloudflare Runtime Verify

on:
  push:
    branches: [main, cloudflare-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Single Worker static + FastAPI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Next.js static assets
        working-directory: web
        env:
          CLOUDFLARE_STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
          test -f out/index.html

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Resolve Python Worker dependencies
        run: uv sync --locked --all-groups

      - name: Import SignalForge with Cloudflare dependency set
        env:
          PYTHONPATH: api
        run: |
          uv run python - <<'PY'
          import httpcore2
          import httpx2
          httpx2.alias_httpx()
          from main import app
          assert app.title == "SignalForge"
          print("SignalForge FastAPI import: OK")
          PY

      - name: Verify evidence and agent contracts
        env:
          PYTHONPATH: api
        run: |
          uv run --with pytest --with 'httpx==0.27.0' pytest -q \
            tests/test_decision.py \
            tests/test_evidence.py \
            tests/test_evidence_intelligence.py \
            tests/test_recovery.py \
            tests/test_capabilities.py \
            tests/test_mcp.py \
            tests/test_cloudflare_market_fallback.py

      - name: Compile Cloudflare Worker without deploying
        run: uv run pywrangler deploy --dry-run

      - name: Assert packaged HTTP runtime dependencies
        run: |
          test -d python_modules/httpx2
          test -d python_modules/httpcore2
          echo "Cloudflare HTTP dependency bundle: OK"

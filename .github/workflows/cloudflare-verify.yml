name: Cloudflare Runtime Verify

on:
  push:
    branches: [cloudflare-runtime]
  workflow_dispatch:

concurrency:
  group: cloudflare-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Single Worker static + FastAPI bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Next.js static assets
        working-directory: web
        env:
          CLOUDFLARE_STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
          test -f out/index.html
          test -f out/judge/index.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Resolve Python Worker dependencies
        working-directory: api
        run: uv sync --all-groups

      - name: Compile Cloudflare Worker without deploying
        working-directory: api
        run: uv run pywrangler deploy --dry-run

name: Pin ESLint on judge branch

on:
  push:
    branches: [judge-ready-build]

permissions:
  contents: write

jobs:
  pin-eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: judge-ready-build

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Pin compatible ESLint
        working-directory: web
        run: npm install --save-dev eslint@9.39.5

      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          if git diff --cached --quiet; then
            echo "No ESLint pin changes required."
            exit 0
          fi
          git commit -m "fix: pin ESLint 9 for Next 16 compatibility"
          git push origin HEAD:judge-ready-build

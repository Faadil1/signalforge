name: Upgrade Next on judge branch

on:
  push:
    branches: [judge-ready-build]

permissions:
  contents: write

jobs:
  upgrade-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: judge-ready-build

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Upgrade Next, React, and ESLint stack
        working-directory: web
        run: |
          npm install next@16.3.5 react@latest react-dom@latest
          npm install --save-dev eslint@latest eslint-config-next@16.3.5 @types/react@latest @types/react-dom@latest
          npm pkg set scripts.lint="eslint ."
          rm -f .eslintrc.json
          cat > eslint.config.mjs <<'EOF'
          import { defineConfig, globalIgnores } from "eslint/config";
          import nextVitals from "eslint-config-next/core-web-vitals";
          import nextTs from "eslint-config-next/typescript";

          const eslintConfig = defineConfig([
            ...nextVitals,
            ...nextTs,
            {
              rules: {
                "@next/next/no-img-element": "off",
              },
            },
            globalIgnores([".next/**", "out/**", "build/**", "next-env.d.ts"]),
          ]);

          export default eslintConfig;
          EOF

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json web/eslint.config.mjs web/.eslintrc.json
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "chore: upgrade Next.js security baseline"
          git push origin HEAD:judge-ready-build

[project]
name = "signalforge-cloudflare-worker"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.0",
  "pydantic==2.9.0",
  "httpx2==2.12.0",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]
addopts = "-q"

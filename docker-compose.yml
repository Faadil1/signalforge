services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalforge-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENABLE_ALERTS: "${ENABLE_ALERTS:-false}"
      ENABLE_BACKTESTS: "${ENABLE_BACKTESTS:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_URL: "${API_URL:-http://api:8000}"
        NEXT_PUBLIC_ENABLE_ALERTS: "${NEXT_PUBLIC_ENABLE_ALERTS:-false}"
        NEXT_PUBLIC_ENABLE_BACKTESTS: "${NEXT_PUBLIC_ENABLE_BACKTESTS:-false}"
    container_name: signalforge-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
<!doctype html>
<html lang="en" data-composition-id="signalforge-opener" data-width="1920" data-height="1080" data-fps="30" data-duration="6">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #EEF3FF; font-family: Inter, Arial, sans-serif; color: #171522; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #EEF3FF; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(50,87,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(50,87,255,.07) 1px, transparent 1px); background-size: 48px 48px; }
      .glow-a, .glow-b { position: absolute; width: 640px; height: 640px; border-radius: 999px; filter: blur(100px); opacity: .28; }
      .glow-a { left: 80px; top: 40px; background: #3257FF; }
      .glow-b { right: 80px; bottom: 20px; background: #FF4F73; }
      .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
      .rule { padding: 24px 34px; border: 1px solid #B9C6F2; border-radius: 20px; background: rgba(255,255,255,.94); box-shadow: 0 28px 90px rgba(50,87,255,.16); font-size: 38px; font-weight: 850; letter-spacing: .02em; }
      .mark { width: 126px; height: 126px; border-radius: 30px; margin: 0 auto 34px; box-shadow: 0 26px 80px rgba(50,87,255,.22); }
      .title { font-size: 112px; font-weight: 950; letter-spacing: -.06em; }
      .tagline { margin-top: 12px; font-size: 44px; color: #596174; font-weight: 650; }
      .accent { margin-top: 38px; color: #3257FF; font-size: 25px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="signalforge-opener" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div class="glow-a"></div>
      <div class="glow-b"></div>

      <div class="center clip" data-start="0" data-duration="2.5" data-track-index="1">
        <div class="rule">AVAILABLE ≠ FRESH ≠ CONSISTENT ≠ ACTIONABLE</div>
      </div>

      <div class="center clip" data-start="2.3" data-duration="3.7" data-track-index="2">
        <div>
          <img class="mark" src="../public/logo.svg" alt="SignalForge" />
          <div class="title">SignalForge</div>
          <div class="tagline">Evidence before recommendation.</div>
          <div class="accent">REST + MCP · read-only authority</div>
        </div>
      </div>
    </div>
  </body>
</html>

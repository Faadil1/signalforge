<!doctype html>
<html lang="en" data-composition-id="signalforge-opener" data-width="1920" data-height="1080" data-fps="30" data-duration="6">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #EEF3FF; font-family: Inter, Arial, sans-serif; color: #171522; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #EEF3FF; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(50,87,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(50,87,255,.07) 1px, transparent 1px); background-size: 48px 48px; }
      .glow-a, .glow-b { position: absolute; width: 640px; height: 640px; border-radius: 999px; filter: blur(100px); opacity: .28; }
      .glow-a { left: 80px; top: 40px; background: #3257FF; }
      .glow-b { right: 80px; bottom: 20px; background: #FF4F73; }
      .scene-content { width: 100%; height: 100%; padding: 120px 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; text-align: center; }
      .rule-card { padding: 26px 38px; border: 1px solid #B9C6F2; border-radius: 22px; background: rgba(255,255,255,.96); box-shadow: 0 28px 90px rgba(50,87,255,.16); font-size: 42px; font-weight: 850; letter-spacing: .02em; }
      .mark { width: 126px; height: 126px; border-radius: 30px; box-shadow: 0 26px 80px rgba(50,87,255,.22); }
      .title { font-size: 112px; font-weight: 950; letter-spacing: -.06em; }
      .tagline { font-size: 44px; color: #596174; font-weight: 650; }
      .accent { margin-top: 10px; color: #3257FF; font-size: 25px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="signalforge-opener" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="grid" data-layout-ignore></div>
      <div class="glow-a" data-layout-ignore></div>
      <div class="glow-b" data-layout-ignore></div>

      <div id="rule-clip" class="scene-content" data-start="0" data-duration="2.4" data-track-index="1">
        <div class="rule-card">AVAILABLE ≠ FRESH ≠ CONSISTENT ≠ ACTIONABLE</div>
      </div>

      <div id="brand-clip" class="scene-content" data-start="2.4" data-duration="3.6" data-track-index="1">
        <img class="mark" src="logo.svg" alt="SignalForge" />
        <div class="title">SignalForge</div>
        <div class="tagline">Evidence before recommendation.</div>
        <div class="accent">REST + MCP · read-only authority</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      tl.from('.rule-card', {y: 34, opacity: 0, scale: 0.97, duration: 0.62, ease: 'power3.out'}, 0.16);
      tl.to('.rule-card', {y: -22, opacity: 0, duration: 0.34, ease: 'power2.in'}, 1.92);
      tl.from('.mark', {y: 32, opacity: 0, scale: 0.86, duration: 0.55, ease: 'power3.out'}, 2.48);
      tl.from('.title', {y: 28, opacity: 0, duration: 0.5, ease: 'power3.out'}, 2.62);
      tl.from('.tagline', {y: 22, opacity: 0, duration: 0.44, ease: 'power3.out'}, 2.82);
      tl.from('.accent', {y: 16, opacity: 0, duration: 0.38, ease: 'power3.out'}, 3.02);
      tl.to('#brand-clip', {opacity: 0, duration: 0.35, ease: 'power2.in'}, 5.55);
      window.__timelines['signalforge-opener'] = tl;
    </script>
  </body>
</html>
